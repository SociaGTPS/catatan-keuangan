<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Keuangan - Steam MP 7000</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .sub {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            display: block;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #0056b3;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #004085;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Steam MP 7000</h2>
        <div class="sub">Pusat Input Keuangan Cabang</div>

        <form id="financeForm">
            <div class="group">
                <label>Pilih Cabang</label>
                <select id="cabang" required>
                    <option value="" disabled selected>-- Pilih Cabang --</option>
                    <option value="Grobogan">Grobogan</option>
                    <option value="Palis">Palis</option>
                    <option value="Kresek">Kresek</option>
                </select>
            </div>

            <div class="group">
                <label>Tipe Transaksi</label>
                <select id="tipe" required>
                    <option value="" disabled selected>-- Pilih Tipe --</option>
                    <option value="Pemasukan">Pemasukan (Uang Masuk)</option>
                    <option value="Pengeluaran">Pengeluaran (Uang Keluar)</option>
                </select>
            </div>

            <div class="group">
                <label>Kategori / Item</label>
                <input type="text" id="kategori" placeholder="Contoh: Cuci Motor, Beli Sabun" required>
            </div>

            <div class="group">
                <label>Jumlah Unit</label>
                <input type="number" id="unit" placeholder="Contoh: 1" required min="1">
            </div>

            <div class="group">
                <label>Total Nominal (Rp)</label>
                <input type="number" id="nominal" placeholder="Contoh: 50000" required min="0">
            </div>

            <div class="group">
                <label>Keterangan (Opsional)</label>
                <textarea id="keterangan" placeholder="Catatan jika ada..." rows="2"></textarea>
            </div>

            <button type="submit" id="btnSimpan">Simpan Catatan</button>
        </form>
    </div>

    <script>
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbxEh-M2SPvBPFvOo41PQQxsj5A3jfUNCa5RjXiIAhZaYIAos-lpXpJEPcDcNQ-Fy2Y/exec";

        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            const dataForm = {
                cabang: document.getElementById('cabang').value,
                tipe: document.getElementById('tipe').value,
                kategori: document.getElementById('kategori').value,
                unit: document.getElementById('unit').value,
                nominal: document.getElementById('nominal').value,
                keterangan: document.getElementById('keterangan').value
            };

            fetch(urlAppsScript, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataForm)
            })
            .then(() => {
                alert(`Sukses disimpan untuk Cabang ${dataForm.cabang}!`);
                document.getElementById('financeForm').reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Gagal mengirim data!');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Simpan Catatan";
            });
        });
    </script>
</body>
</html>
