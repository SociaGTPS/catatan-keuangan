<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Keuangan - Steam MP 7000</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Steam MP 7000</h2>
        <p class="text-sm text-center text-gray-500 mb-6">Pusat Input Data Keuangan Cabang</p>

        <form id="financeForm" class="space-y-4">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Pilih Cabang</label>
                <select id="cabang" required class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>-- Pilih Cabang --</option>
                    <option value="Grobogan">Grobogan</option>
                    <option value="Palis">Palis</option>
                    <option value="Kresek">Kresek</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Tipe Transaksi</label>
                <select id="tipe" required class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="" disabled selected>-- Pilih Tipe --</option>
                    <option value="Pemasukan">Pemasukan (Uang Masuk / Setoran)</option>
                    <option value="Pengeluaran">Pengeluaran (Beli Sabun, Gaji, dll)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Kategori / Item</label>
                <input type="text" id="kategori" placeholder="Contoh: Cuci Motor, Beli Semir, Makan Admin" required 
                       class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Jumlah Unit / Banyaknya</label>
                <input type="number" id="unit" placeholder="Contoh: 1, 5, 10" required min="1"
                       class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Total Nominal (Rupiah)</label>
                <input type="number" id="nominal" placeholder="Contoh: 50000 (Tanpa Titik)" required min="0"
                       class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Keterangan Tambahan (Opsional)</label>
                <textarea id="keterangan" placeholder="Catatan tambahan jika ada..." rows="2"
                          class="w-full p-3 border rounded-xl bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit" id="btnSimpan" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl transition duration-300 shadow-md">
                Simpan Catatan Cabang
            </button>
        </form>
    </div>

    <script>
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbxEh-M2SPvBPFvOo41PQQxsj5A3jfUNCa5RjXiIAhZaYIAos-lpXpJEPcDcNQ-Fy2Y/exec";

        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            
            btn.disabled = true;
            btn.innerText = "Mengirim data ke Sheets...";
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btn.classList.add('bg-gray-400', 'cursor-not-allowed');

            const dataForm = {
                cabang: document.getElementById('cabang').value,
                tipe: document.getElementById('tipe').value,
                kategori: document.getElementById('kategori').value,
                unit: document.getElementById('unit').value,
                nominal: document.getElementById('nominal').value,
                keterangan: document.getElementById('keterangan').value
            };

            fetch(urlAppsScript, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dataForm)
            })
            .then(() => {
                alert(`Data berhasil disimpan ke Google Sheets untuk Cabang ${dataForm.cabang}!`);
                document.getElementById('financeForm').reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Waduh, koneksi gagal atau ada gangguan sistem!');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Simpan Catatan Cabang";
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            });
        });
    </script>
</body>
</html>
