<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan - Steam MP 7000</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .sub {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
        }
        select, input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fafafa;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #1e3c72;
            outline: none;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Steam MP 7000</h2>
        <div class="sub">Input Keuangan Cabang</div>

        <form id="financeForm">
            <div class="form-group">
                <label>Pilih Cabang</label>
                <select id="cabang" required>
                    <option value="" disabled selected>-- Pilih Cabang --</option>
                    <option value="Grobogan">Grobogan</option>
                    <option value="Palis">Palis</option>
                    <option value="Kresek">Kresek</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tipe Transaksi</label>
                <select id="tipe" required>
                    <option value="" disabled selected>-- Pilih Tipe --</option>
                    <option value="Pemasukan">Pemasukan (Uang Masuk)</option>
                    <option value="Pengeluaran">Pengeluaran (Uang Keluar)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Kategori / Item</label>
                <input type="text" id="kategori" placeholder="Contoh: Cuci Motor, Beli Sabun" required>
            </div>

            <div class="form-group">
                <label>Jumlah Unit</label>
                <input type="number" id="unit" placeholder="Contoh: 1" required min="1">
            </div>

            <div class="form-group">
                <label>Total Nominal (Rp)</label>
                <input type="number" id="nominal" placeholder="Contoh: 50000" required min="0">
            </div>

            <div class="form-group">
                <label>Keterangan (Opsional)</label>
                <textarea id="keterangan" placeholder="Catatan tambahan jika ada..." rows="2"></textarea>
            </div>

            <button type="submit" id="btnSimpan">SIMPAN DATA</button>
        </form>
    </div>

    <script>
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbxEh-M2SPvBPFvOo41PQQxsj5A3jfUNCa5RjXiIAhZaYIAos-lpXpJEPcDcNQ-Fy2Y/exec";

        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            // Menggunakan URLSearchParams agar data dipaksa masuk ke Google Apps Script tanpa hambatan
            const dataData = new URLSearchParams();
            dataData.append('cabang', document.getElementById('cabang').value);
            dataData.append('tipe', document.getElementById('tipe').value);
            dataData.append('kategori', document.getElementById('kategori').value);
            dataData.append('unit', document.getElementById('unit').value);
            dataData.append('nominal', document.getElementById('nominal').value);
            dataData.append('keterangan', document.getElementById('keterangan').value);

            fetch(urlAppsScript, {
                method: 'POST',
                body: dataData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(() => {
                alert("Mantap! Data Berhasil Disimpan.");
                document.getElementById('financeForm').reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                alert("Waduh, Gagal mengirim data!");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "SIMPAN DATA";
            });
        });
    </script>
</body>
</html>
