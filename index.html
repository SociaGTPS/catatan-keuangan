<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keuangan - Steam MP 7000</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .wrapper {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
        }
        .sub-header {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-control {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f9f9f9;
            color: #333;
            transition: all 0.3s ease;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #1e3c72;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.15);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3);
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(30, 60, 114, 0.4);
        }
        button:disabled {
            background: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>Steam MP 7000</h2>
        <div class="sub-header font-track">Input Keuangan Cabang</div>

        <form id="financeForm">
            <div class="form-control">
                <label>Pilih Cabang</label>
                <select id="cabang" name="cabang" required>
                    <option value="" disabled selected>-- Pilih Cabang --</option>
                    <option value="Grobogan">Grobogan</option>
                    <option value="Palis">Palis</option>
                    <option value="Kresek">Kresek</option>
                </select>
            </div>

            <div class="form-control">
                <label>Tipe Transaksi</label>
                <select id="tipe" name="tipe" required>
                    <option value="" disabled selected>-- Pilih Tipe --</option>
                    <option value="Pemasukan">Pemasukan (Uang Masuk)</option>
                    <option value="Pengeluaran">Pengeluaran (Uang Keluar)</option>
                </select>
            </div>

            <div class="form-control">
                <label>Kategori / Nama Item</label>
                <input type="text" id="kategori" name="kategori" placeholder="Contoh: Cuci Motor, Beli Sabun" required>
            </div>

            <div class="form-control">
                <label>Jumlah Unit</label>
                <input type="number" id="unit" name="unit" placeholder="Contoh: 1" required min="1">
            </div>

            <div class="form-control">
                <label>Total Nominal (Rp)</label>
                <input type="number" id="nominal" name="nominal" placeholder="Contoh: 50000 (Tanpa Titik)" required min="0">
            </div>

            <div class="form-control">
                <label>Keterangan Tambahan</label>
                <textarea id="keterangan" name="keterangan" placeholder="Catatan opsional jika ada..." rows="2"></textarea>
            </div>

            <button type="submit" id="btnSimpan">SIMPAN DATA</button>
        </form>
    </div>

    <script>
        const urlAppsScript = "https://script.google.com/macros/s/AKfycbxEh-M2SPvBPFvOo41PQQxsj5A3jfUNCa5RjXiIAhZaYIAos-lpXpJEPcDcNQ-Fy2Y/exec";

        document.getElementById('financeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSimpan');
            
            btn.disabled = true;
            btn.innerText = "Memproses Data...";

            // Menggunakan URLSearchParams agar data terkirim mulus ke Apps Script tanpa hambatan CORS
            constformData = new URLSearchParams();
            formData.append('cabang', document.getElementById('cabang').value);
            formData.append('tipe', document.getElementById('tipe').value);
            formData.append('kategori', document.getElementById('kategori').value);
            formData.append('unit', document.getElementById('unit').value);
            formData.append('nominal', document.getElementById('nominal').value);
            formData.append('keterangan', document.getElementById('keterangan').value);

            fetch(urlAppsScript, {
                method: 'POST',
                body: formData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(response => {
                alert(`Sip! Data Cabang ${document.getElementById('cabang').value} Berhasil Masuk Ke Sheets!`);
                document.getElementById('financeForm').reset();
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Gagal mengirim data, silakan cek jaringan Anda!');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "SIMPAN DATA";
            });
        });
    </script>
</body>
</html>
