<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catat Keuangan Steam MP 7000</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
        
        <div class="bg-red-600 text-white p-5 rounded-b-2xl shadow-md">
            <h1 class="text-xl font-bold tracking-wide">Steam MP 7000</h1>
            <p class="text-xs text-red-100 mt-1">Sistem Pencatatan Multi-Cabang & Pendapatan Owner</p>
            
            <div class="mt-3">
                <label class="text-[10px] text-red-200 block font-semibold mb-1">PILIH CABANG UNTUK MELIHAT REKAP:</label>
                <select id="filterCabang" class="w-full bg-red-700 text-white border border-red-500 rounded-lg p-2 text-xs font-bold focus:outline-none" onchange="updateTampilan()">
                    <option value="Semua">Semua Cabang (Gabungan)</option>
                    <option value="Cabang Grobogan">Cabang Grobogan</option>
                    <option value="Cabang Palis">Cabang Palis</option>
                    <option value="Cabang Cayur">Cabang Cayur</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4 bg-red-700 p-3 rounded-xl text-center">
                <div>
                    <span class="text-[10px] text-red-200 block uppercase font-bold">Total Pengeluaran</span>
                    <span id="totalPengeluaran" class="text-base font-bold">Rp 0</span>
                </div>
                <div class="border-l border-red-500">
                    <span class="text-[10px] text-red-200 block uppercase font-bold">Pendapatan Kotor Owner</span>
                    <span id="totalPemasukan" class="text-base font-bold text-green-300">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="p-4">
            <form id="formKeuangan" class="bg-gray-50 p-4 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-xs font-bold text-gray-700 mb-3 border-b pb-2 uppercase tracking-wider text-center">Input Data Operasional</h2>
                
                <div class="mb-3">
                    <label class="text-xs text-gray-500 block mb-1 font-medium">Cabang Tempat Transaksi *</label>
                    <select id="cabang" class="w-full border p-2.5 rounded-lg text-sm bg-white font-semibold" required>
                        <option value="Cabang Grobogan">Cabang Grobogan</option>
                        <option value="Cabang Palis">Cabang Palis</option>
                        <option value="Cabang Cayur">Cabang Cayur</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="text-xs text-gray-500 block mb-1 font-medium">Jenis Catatan *</label>
                    <select id="tipe" class="w-full border p-2.5 rounded-lg text-sm bg-white font-bold text-red-600" onchange="aturFormTipe()">
                        <option value="Pengeluaran">Pengeluaran Cabang (Utama)</option>
                        <option value="Pemasukan">Pemasukan (Hitung Unit Motor)</option>
                    </select>
                </div>

                <div id="wrapperPemasukan" class="hidden bg-green-50 p-3 rounded-lg border border-green-200 mb-3">
                    <label class="text-xs text-green-700 block mb-1 font-bold">Jumlah Unit Motor Ter-cuci *</label>
                    <div class="flex gap-2 items-center">
                        <input type="number" id="jumlahUnit" placeholder="Contoh: 25" class="w-1/2 border p-2 rounded-lg text-sm focus:outline-green-500">
                        <span class="text-xs text-gray-500 font-medium">x Rp 4.000 / unit</span>
                    </div>
                    <p class="text-[10px] text-green-600 mt-1">* Sistem akan otomatis menghitung pendapatan kotor Owner</p>
                </div>

                <div id="wrapperNominal" class="mb-3">
                    <label class="text-xs text-gray-500 block mb-1 font-medium">Nominal Pengeluaran (Rp) *</label>
                    <input type="number" id="nominal" placeholder="Contoh: 50000" class="w-full border p-2.5 rounded-lg text-sm focus:outline-red-500">
                </div>

                <div id="wrapperKategori" class="mb-3">
                    <label class="text-xs text-gray-500 block mb-1 font-medium">Kategori Kebutuhan *</label>
                    <select id="kategori" class="w-full border p-2.5 rounded-lg text-sm bg-white">
                        <option value="Sabun / Shampo">Bahan (Sabun, Shampo, Semir)</option>
                        <option value="Listrik Token">Listrik / Token</option>
                        <option value="Sewa Ruko">Sewa Ruko</option>
                        <option value="Perawatan Mesin">Perawatan Mesin / Sparepart</option>
                        <option value="Beras Karyawan">Beras Karyawan</option>
                        <option value="Kopi Karyawan">Kopi / Gula Karyawan</option>
                        <option value="WiFi">WiFi Bulanan</option>
                        <option value="Gaji / Komisi">Gaji / Komisi / Bon</option>
                        <option value="Lain-lain">Lain-lain / Keperluan Mendadak</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="text-xs text-gray-500 block mb-1 font-medium">Keterangan Tambahan / Detail *</label>
                    <textarea id="keterangan" placeholder="Contoh: Beli sabun salju merk X atau Cuci harian admin" class="w-full border p-2.5 rounded-lg text-sm h-16" required></textarea>
                </div>

                <button type="submit" class="w-full bg-gray-900 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-800 transition-colors shadow">
                    Simpan Catatan Cabang
                </button>
            </form>
        </div>

        <div class="px-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-gray-700">Riwayat Transaksi</h3>
                <button id="btnEkspor" class="text-xs bg-green-600 text-white px-3 py-1 rounded shadow-sm font-medium hidden">
                    Unduh Excel (.CSV)
                </button>
            </div>
            <div id="daftarTransaksi" class="space-y-2">
                </div>
        </div>

    </div>

    <script>
        let transaksi = JSON.parse(localStorage.getItem('data_keuangan_mp7000')) || [];

        const form = document.getElementById('formKeuangan');
        const daftarContainer = document.getElementById('daftarTransaksi');
        const btnEkspor = document.getElementById('btnEkspor');

        function aturFormTipe() {
            const tipe = document.getElementById('tipe').value;
            if (tipe === 'Pemasukan') {
                document.getElementById('wrapperPemasukan').classList.remove('hidden');
                document.getElementById('wrapperNominal').classList.add('hidden');
                document.getElementById('wrapperKategori').classList.add('hidden');
                document.getElementById('jumlahUnit').setAttribute('required', 'true');
                document.getElementById('nominal').removeAttribute('required');
            } else {
                document.getElementById('wrapperPemasukan').classList.add('hidden');
                document.getElementById('wrapperNominal').classList.remove('hidden');
                document.getElementById('wrapperKategori').classList.remove('hidden');
                document.getElementById('nominal').setAttribute('required', 'true');
                document.getElementById('jumlahUnit').removeAttribute('required');
            }
        }

        function updateTampilan() {
            daftarContainer.innerHTML = '';
            let totalKeluar = 0;
            let totalMasuk = 0;
            const filter = document.getElementById('filterCabang').value;

            const dataTerfilter = transaksi.filter(item => filter === 'Semua' || item.cabang === filter);

            if (dataTerfilter.length === 0) {
                daftarContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-6">Belum ada catatan untuk cabang ini.</p>';
                btnEkspor.classList.add('hidden');
            } else {
                btnEkspor.classList.remove('hidden');
            }

            dataTerfilter.forEach((item, index) => {
                if (item.tipe === 'Pengeluaran') totalKeluar += item.nominal;
                else totalMasuk += item.nominal;

                const div = document.createElement('div');
                div.className = "bg-gray-50 p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-xs";
                div.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-[9px] bg-gray-800 text-white px-1.5 py-0.5 rounded font-bold">${item.cabang}</span>
                            <span class="text-[9px] px-1.5 py-0.5 rounded font-semibold ${item.tipe === 'Pengeluaran' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">
                                ${item.kategori}
                            </span>
                            <span class="text-[9px] text-gray-400">${item.tanggal}</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-1 font-medium">${item.keterangan} ${item.unit ? `(${item.unit} Motor)` : ''}</p>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <span class="text-xs font-bold ${item.tipe === 'Pengeluaran' ? 'text-red-600' : 'text-green-600'}">
                            ${item.tipe === 'Pengeluaran' ? '-' : '+'} Rp ${item.nominal.toLocaleString('id-ID')}
                        </span>
                        <button onclick="hapusData('${item.id}')" class="text-gray-300 hover:text-red-500 text-xs">✕</button>
                    </div>
                `;
                daftarContainer.appendChild(div);
            });

            document.getElementById('totalPengeluaran').innerText = 'Rp ' + totalKeluar.toLocaleString('id-ID');
            document.getElementById('totalPemasukan').innerText = 'Rp ' + totalMasuk.toLocaleString('id-ID');
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const tipe = document.getElementById('tipe').value;
            let kalkulasiNominal = 0;
            let unitMasuk = null;
            let kategoriFix = document.getElementById('kategori').value;

            if (tipe === 'Pemasukan') {
                unitMasuk = parseInt(document.getElementById('jumlahUnit').value);
                kalkulasiNominal = unitMasuk * 4000; 
                kategoriFix = "Setoran Unit Motor";
            } else {
                kalkulasiNominal = parseInt(document.getElementById('nominal').value);
            }

            const dataBaru = {
                id: 'trx_' + Date.now(),
                cabang: document.getElementById('cabang').value,
                tanggal: new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}),
                tipe: tipe,
                nominal: kalkulasiNominal,
                unit: unitMasuk,
                kategori: kategoriFix,
                keterangan: document.getElementById('keterangan').value
            };

            transaksi.unshift(dataBaru);
            localStorage.setItem('data_keuangan_mp7000', JSON.stringify(transaksi));
            form.reset();
            document.getElementById('jumlahUnit').value = '';
            document.getElementById('nominal').value = '';
            aturFormTipe();
            updateTampilan();
        });

        function hapusData(id) {
            if (confirm('Hapus catatan ini?')) {
                transaksi = transaksi.filter(item => item.id !== id);
                localStorage.setItem('data_keuangan_mp7000', JSON.stringify(transaksi));
                updateTampilan();
            }
        }

        btnEkspor.addEventListener('click', function() {
            let csv = "ID,Cabang,Tanggal,Tipe,Kategori,Unit Motor,Nominal,Keterangan\n";
            transaksi.forEach(item => {
                csv += `"${item.id}","${item.cabang}","${item.tanggal}","${item.tipe}","${item.kategori}","${item.unit || 0}",${item.nominal},"${item.keterangan}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Laporan_Steam_MP7000_${document.getElementById('filterCabang').value}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        aturFormTipe();
        updateTampilan();
    </script>
</body>
</html>
